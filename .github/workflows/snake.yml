# Save as .github/workflows/snake.yml in the 0x496C6B696E/0x496C6B696E repo.
# Generates the contribution snake every 12 hours into the "output" branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: 0x496C6B696E
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_dots=#161b22,#4a4f57,#737a85,#a3a4ae,#e5dfd2&color_snake=#b8b4ad
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#161b22,#4a4f57,#737a85,#a3a4ae,#e5dfd2&color_snake=#b8b4ad
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
