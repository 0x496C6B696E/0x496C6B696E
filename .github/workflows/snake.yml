# Renders the contribution snake and the 3D contribution map into the "output" branch.
name: Contribution art

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: "0x496C6B696E"
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_dots=#161b22,#4a4f57,#737a85,#a3a4ae,#e5dfd2&color_snake=#b8b4ad
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#161b22,#4a4f57,#737a85,#a3a4ae,#e5dfd2&color_snake=#b8b4ad

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: "0x496C6B696E"
          SETTING_JSON: conf/3d.json

      - name: Collect outputs
        run: |
          ls -la dist profile-3d-contrib || true
          mkdir -p out
          cp dist/*.svg out/
          cp profile-3d-contrib/*.svg out/
          ls -la out

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
